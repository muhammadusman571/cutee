<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. WhatsApp & Social Preview Title -->
    <meta property="og:title" content="Join Live on StreamMix Live" />

    <!-- 2. Preview Description / Subtitle -->
    <meta property="og:description" content="Watch this live stream on StreamMix Live" />

    <!-- 3. Mascot / App Logo Image (Must be full https URL, PNG/JPG, min 300x300px) -->
    <meta property="og:image" content="https://admin.streamixlive.com/storage/app_logo.jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />

    <!-- 4. Target URL & Type -->
    <meta property="og:url" content="https://admin.streamixlive.com/share?type=LIVE" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StreamMix Live" />

    <!-- Twitter Card Fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join Live on StreamMix Live" />
    <meta name="twitter:description" content="Watch this live stream on StreamMix Live" />
    <meta name="twitter:image" content="https://admin.streamixlive.com/storage/app_logo.jpeg" />

    <title>StreamMix Live</title>
</head>
<body>
    <script>
        // App auto-redirect logic for Android / iOS
        window.location.href = "streammix://open?type=LIVE&id=" + new URLSearchParams(window.location.search).get('id');
    </script>
</body>
</html>
